spring:
  application:
    name: erms-api
  profiles:
    default: local
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
security:
  jwt:
    # Base64-encoded secret containing at least 256 bits. Never use a committed default.
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:erms-api}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

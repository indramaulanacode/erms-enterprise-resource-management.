spring:
  application:
    name: erms-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/erms}
    username: ${DB_USERNAME:erms}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:erms-api}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:P30D}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
